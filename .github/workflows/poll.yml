name: Poll Roblox servers

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run poller
        run: node poll.js

      - name: Commit servers.json
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add servers.json
          git commit -m "update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no change"
          git push
